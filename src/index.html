<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Универсальный стартовый шаблон</title>
    @@include("parts/favicon-links.html")
    <link rel="stylesheet" href="css/app.min.css?v=1" />
    <script>
      document.body
        ? document.body.classList.add("_js-ready")
        : document.addEventListener("DOMContentLoaded", () =>
            document.body.classList.add("_js-ready"),
          );
    </script>
  </head>

  <body>
    <!-- 🛰 HARNESS INTEGRATION: контейнер фонового анализа.
         mountDashboardBlock() (#harnessBlock) рендерит сюда состояние
         диспетчера, живые аномалии и новости QUIK (см. harness-integration). -->
    <section
      id="harnessBlock"
      data-harness-container
      aria-live="polite"
      aria-label="Harness — фоновый анализ"
    >
      <div class="harness-block harness-placeholder">🛰 Загрузка состояния…</div>
    </section>

    <script src="js/app.min.js" defer></script>
  </body>
</html>
